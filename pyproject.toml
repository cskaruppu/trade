[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nsetrade"
version = "0.1.0"
description = "NSE stock pattern, signal, screening and backtesting toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nsetrade" }]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.30"]
kite = ["kiteconnect>=4.2"]
charts = ["matplotlib>=3.6"]
ai = ["anthropic>=0.40"]
dashboard = ["streamlit>=1.30", "matplotlib>=3.6", "plotly>=5.18",
             "streamlit-option-menu>=0.3.12"]
dev = ["pytest>=7.0", "matplotlib>=3.6", "plotly>=5.18"]

[project.scripts]
nsetrade = "nsetrade.cli:main"

[tool.setuptools.packages.find]
include = ["nsetrade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
