# Copy this file to config.yaml and fill in your details.
# config.yaml is git-ignored so your credentials never get committed.

# Which data provider to use by default: "yfinance" or "kite"
default_provider: yfinance

providers:
  yfinance:
    # yfinance needs no credentials. NSE symbols are suffixed with .NS
    # automatically (e.g. RELIANCE -> RELIANCE.NS).
    {}

  kite:
    # Zerodha Kite Connect. See https://kite.trade/docs/connect/v3/
    # The access_token is generated daily via the Kite login flow.
    # You can also set these via environment variables:
    #   KITE_API_KEY, KITE_ACCESS_TOKEN
    api_key: "your_api_key_here"
    access_token: "your_daily_access_token_here"

# Default screening universe: nifty50 | nifty100 | nifty500 | custom
default_universe: nifty50
