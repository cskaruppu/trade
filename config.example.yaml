# Copy this file to config.yaml and fill in your details.
# config.yaml is git-ignored so your credentials never get committed.

# Which data provider to use by default: "yfinance" or "bhavcopy" (both free)
default_provider: yfinance

providers:
  yfinance:
    # yfinance needs no credentials. NSE symbols are suffixed with .NS
    # automatically (e.g. RELIANCE -> RELIANCE.NS).
    {}

  bhavcopy:
    # Bulk end-of-day data for the whole NSE from a local store.
    # Build it once with: nsetrade fetch-bhavcopy --days 400
    # (no key, no rate limits). Optional: db path, adjust (split adjustment).
    {}

# Default screening universe: nifty50 | nifty100 | nifty500 | custom
default_universe: nifty50

# Optional AI trade thesis (Claude / Anthropic API). This is the ONE feature
# that sends data off your machine — and only a compact numeric summary, never
# raw prices. Leave api_key empty to keep everything fully local.
# Get a key at https://console.anthropic.com (or set ANTHROPIC_API_KEY).
ai:
  api_key: ""
  model: claude-opus-4-8

# Optional alerting for the live `watch` scanner.
alerts:
  console: true
  log_file: alerts.log
  # Push alerts to your phone via a Telegram bot (optional).
  # Create a bot with @BotFather to get a token, and get your chat_id from
  # @userinfobot. You can also set TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID env vars.
  telegram:
    token: ""
    chat_id: ""
